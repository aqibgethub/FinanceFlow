<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanceFlow Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box;margin:0;padding:0}
:root{
  --accent1:#7c3aed;--accent2:#a855f7;--accent3:#ec4899;
  --surface:rgba(255,255,255,0.055);--surface-hover:rgba(255,255,255,0.09);
  --border:rgba(255,255,255,0.1);--border-accent:rgba(139,92,246,0.5);
}
body{background:#080614;color:#f1f0ff;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(124,58,237,0.18) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 100%,rgba(236,72,153,0.12) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(168,85,247,0.06) 0%,transparent 70%);pointer-events:none;z-index:0}
.glass{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:20px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.glass:hover{background:var(--surface-hover);border-color:var(--border-accent);transform:translateY(-2px);box-shadow:0 16px 40px -12px rgba(124,58,237,0.3)}
.glass-sm{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px}
.sidebar{position:fixed;left:0;top:0;height:100vh;width:260px;background:rgba(8,6,20,0.92);backdrop-filter:blur(24px);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid var(--border)}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent1),var(--accent3));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;margin:2px 12px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,0.55);font-size:14px;font-weight:500;transition:all .2s;border:1px solid transparent}
.nav-item:hover{background:rgba(124,58,237,0.15);color:rgba(255,255,255,0.9);border-color:rgba(124,58,237,0.2)}
.nav-item.active{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(168,85,247,0.2));color:#fff;border-color:rgba(124,58,237,0.4);box-shadow:0 4px 15px -4px rgba(124,58,237,0.3)}
.nav-item .icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.nav-item.active .icon{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.4)}
.nav-item:not(.active) .icon{background:rgba(255,255,255,0.07)}
.topbar{background:rgba(8,6,20,0.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:30}
.stat-card{padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;opacity:.08;transition:all .4s}
.stat-card.green::before{background:#10b981}
.stat-card.blue::before{background:#3b82f6}
.stat-card.red::before{background:#ef4444}
.stat-card.purple::before{background:#8b5cf6}
.stat-card:hover::before{opacity:.18;transform:scale(1.4)}
.stat-label{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:10px}
.stat-value{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat-icon{position:absolute;right:22px;top:22px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.green .stat-icon{background:rgba(16,185,129,.15);color:#34d399}
.blue .stat-icon{background:rgba(59,130,246,.15);color:#60a5fa}
.red .stat-icon{background:rgba(239,68,68,.15);color:#f87171}
.purple .stat-icon{background:rgba(139,92,246,.15);color:#a78bfa}
.green .stat-value{color:#34d399}
.blue .stat-value{color:#60a5fa}
.red .stat-value{color:#f87171}
.purple .stat-value{color:#a78bfa}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.income{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.2)}
.badge.expense{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.tx-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tx-row:last-child{border:none}
.tx-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--accent1),var(--accent2));border:none;color:#fff;padding:10px 22px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 25px -6px rgba(124,58,237,.5)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:rgba(255,255,255,.7);padding:9px 18px;border-radius:11px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.section-title{font-size:15px;font-weight:600;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;margin-bottom:18px}
.section-title .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent2))}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);border-radius:20px;padding:4px 12px;font-size:12px;color:#c4b5fd}
.input-field{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:11px;color:#fff;padding:10px 14px;font-size:14px;width:100%;transition:all .2s;outline:none}
.input-field:focus{border-color:var(--accent1);background:rgba(124,58,237,.08);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.input-field::placeholder{color:rgba(255,255,255,.3)}
select.input-field option{background:#14103a;color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#0e0a24;border:1px solid var(--border-accent);border-radius:24px;padding:32px;width:440px;max-width:95vw}
.progress-track{background:rgba(255,255,255,.08);border-radius:20px;height:6px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent1),var(--accent2));transition:width .5s ease}
.progress-fill.over{background:linear-gradient(90deg,#ef4444,#f97316)}
.tag{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:3px 10px;font-size:12px;color:rgba(255,255,255,.6)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(124,58,237,.4);border-radius:4px}
.live-chip{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:20px;padding:3px 10px;font-size:11px;color:#34d399;display:flex;align-items:center;gap:5px}
.live-dot{width:5px;height:5px;border-radius:50%;background:#34d399;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.curr-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:11px;padding:7px 12px;cursor:pointer;transition:all .2s;font-size:13px;font-weight:500}
.curr-btn:hover{background:rgba(255,255,255,.11);border-color:rgba(124,58,237,.4)}
.curr-list{max-height:220px;overflow-y:auto}
.curr-opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:all .15s;font-size:13px}
.curr-opt:hover{background:rgba(124,58,237,.2)}
.curr-opt.sel{background:rgba(124,58,237,.25);border-left:2px solid var(--accent1)}
.drop-panel{position:absolute;top:calc(100% + 8px);left:0;background:#0e0a24;border:1px solid rgba(124,58,237,.3);border-radius:16px;padding:14px;z-index:200;width:280px;display:none;box-shadow:0 20px 40px -10px rgba(0,0,0,.6)}
.drop-panel.open{display:block}
.main-content{margin-left:260px;padding:28px;min-height:100vh;position:relative;z-index:1}
@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;padding:16px}}
.chart-wrap{position:relative;height:220px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div style="display:flex;align-items:center;gap:12px">
      <div class="logo-icon"><i class="fas fa-chart-line" style="color:#fff"></i></div>
      <div>
        <div style="font-weight:700;font-size:15px">FinanceFlow</div>
        <div style="font-size:11px;color:rgba(255,255,255,.4);font-weight:500">Pro Edition</div>
      </div>
    </div>
  </div>
  <div style="padding:20px 0;flex:1">
    <div style="padding:0 12px;margin-bottom:6px;font-size:10px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.25);text-transform:uppercase">MAIN MENU</div>
    <div class="nav-item active" onclick="nav('dashboard',this)"><div class="icon"><i class="fas fa-tachometer-alt"></i></div><span>Dashboard</span></div>
    <div class="nav-item" onclick="nav('transactions',this)"><div class="icon"><i class="fas fa-exchange-alt"></i></div><span>Transactions</span></div>
    <div class="nav-item" onclick="nav('analytics',this)"><div class="icon"><i class="fas fa-chart-pie"></i></div><span>Analytics</span></div>
    <div class="nav-item" onclick="nav('budget',this)"><div class="icon"><i class="fas fa-bullseye"></i></div><span>Budget</span></div>
    <div style="padding:0 12px;margin:20px 0 6px;font-size:10px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,.25);text-transform:uppercase">SETTINGS</div>
    <div class="nav-item" onclick="nav('profile',this)"><div class="icon"><i class="fas fa-user"></i></div><span>Profile</span></div>
  </div>
  <div style="padding:16px 12px;border-top:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(124,58,237,.1);border-radius:12px;border:1px solid rgba(124,58,237,.2)">
      <div class="avatar">JD</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:600">John Doe</div>
        <div style="font-size:11px;color:rgba(255,255,255,.4)">Pro Account</div>
      </div>
      <i class="fas fa-ellipsis-v" style="color:rgba(255,255,255,.3);font-size:12px"></i>
    </div>
  </div>
</aside>

<div class="main-content">
  <div class="topbar" style="margin:-28px -28px 28px;border-radius:0">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer" id="menuBtn"><i class="fas fa-bars"></i></button>
    <div style="flex:1;font-size:16px;font-weight:600;color:rgba(255,255,255,.9)" id="pageTitle">Dashboard</div>
    <div class="live-chip"><div class="live-dot"></div>Live rates</div>
    <div style="position:relative" id="currDropWrapper">
      <div class="curr-btn" onclick="toggleDrop()">
        <span id="selFlag">🇺🇸</span>
        <span id="selCode" style="font-weight:700">USD</span>
        <i class="fas fa-chevron-down" style="font-size:10px;color:rgba(255,255,255,.4)"></i>
      </div>
      <div class="drop-panel" id="dropPanel">
        <input class="input-field" id="currSearch" placeholder="Search currencies…" oninput="renderCurrList(this.value)" style="margin-bottom:10px">
        <div class="curr-list" id="currList"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button style="background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.6);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:13px"><i class="fas fa-bell"></i></button>
      <div class="avatar" style="width:36px;height:36px;font-size:13px">JD</div>
    </div>
  </div>

  <div id="page"></div>
</div>

<!-- Transaction Modal -->
<div class="modal-overlay" id="txModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h3 style="font-size:18px;font-weight:700" id="modalTitle">Add Transaction</h3>
      <button onclick="closeModal()" style="background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px"><i class="fas fa-times"></i></button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">TYPE</label>
        <select class="input-field" id="mType"><option value="expense">Expense</option><option value="income">Income</option></select>
      </div>
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">CURRENCY</label>
        <select class="input-field" id="mCurr"></select>
      </div>
      <div style="grid-column:1/-1">
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">AMOUNT</label>
        <input class="input-field" type="number" id="mAmt" placeholder="0.00">
      </div>
      <div style="grid-column:1/-1">
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">DESCRIPTION</label>
        <input class="input-field" id="mDesc" placeholder="What was this for?">
      </div>
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">CATEGORY</label>
        <select class="input-field" id="mCat">
          <option>Food</option><option>Shopping</option><option>Bills</option>
          <option>Transport</option><option>Entertainment</option><option>Salary</option><option>Freelancing</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">DATE</label>
        <input class="input-field" type="date" id="mDate">
      </div>
      <div style="grid-column:1/-1">
        <label style="font-size:12px;color:rgba(255,255,255,.4);display:block;margin-bottom:6px">PAYMENT METHOD</label>
        <select class="input-field" id="mPay"><option>Cash</option><option>Card</option><option>Bank Transfer</option></select>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px">
      <button class="btn-primary" style="flex:1;justify-content:center" onclick="saveTx()"><i class="fas fa-check"></i> Save Transaction</button>
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;right:24px;z-index:300;display:none;align-items:center;gap:10px;background:#0e0a24;border:1px solid rgba(124,58,237,.4);border-radius:14px;padding:12px 18px;font-size:14px;box-shadow:0 16px 40px -8px rgba(0,0,0,.5)"></div>

<script>
// ==================== DATA ====================
const currencies = {
  USD:{s:"$",n:"US Dollar",f:"🇺🇸",r:1},
  EUR:{s:"€",n:"Euro",f:"🇪🇺",r:0.92},
  GBP:{s:"£",n:"British Pound",f:"🇬🇧",r:0.79},
  JPY:{s:"¥",n:"Japanese Yen",f:"🇯🇵",r:148.5},
  CNY:{s:"¥",n:"Chinese Yuan",f:"🇨🇳",r:7.25},
  INR:{s:"₹",n:"Indian Rupee",f:"🇮🇳",r:83.5},
  PKR:{s:"₨",n:"Pakistani Rupee",f:"🇵🇰",r:278.5},
  BDT:{s:"৳",n:"Bangladeshi Taka",f:"🇧🇩",r:109.5},
  AED:{s:"د.إ",n:"UAE Dirham",f:"🇦🇪",r:3.67},
  SAR:{s:"﷼",n:"Saudi Riyal",f:"🇸🇦",r:3.75},
  CAD:{s:"$",n:"Canadian Dollar",f:"🇨🇦",r:1.37},
  AUD:{s:"$",n:"Australian Dollar",f:"🇦🇺",r:1.52},
  CHF:{s:"Fr",n:"Swiss Franc",f:"🇨🇭",r:0.88},
  KRW:{s:"₩",n:"South Korean Won",f:"🇰🇷",r:1350},
  SGD:{s:"$",n:"Singapore Dollar",f:"🇸🇬",r:1.34},
  MYR:{s:"RM",n:"Malaysian Ringgit",f:"🇲🇾",r:4.7},
  THB:{s:"฿",n:"Thai Baht",f:"🇹🇭",r:36.2},
  TRY:{s:"₺",n:"Turkish Lira",f:"🇹🇷",r:32},
  BRL:{s:"R$",n:"Brazilian Real",f:"🇧🇷",r:5.05},
  ZAR:{s:"R",n:"South African Rand",f:"🇿🇦",r:18.9},
  NGN:{s:"₦",n:"Nigerian Naira",f:"🇳🇬",r:1510},
  EGP:{s:"E£",n:"Egyptian Pound",f:"🇪🇬",r:48},
  RUB:{s:"₽",n:"Russian Ruble",f:"🇷🇺",r:91.5},
  SEK:{s:"kr",n:"Swedish Krona",f:"🇸🇪",r:10.55},
  NOK:{s:"kr",n:"Norwegian Krone",f:"🇳🇴",r:10.7},
  DKK:{s:"kr",n:"Danish Krone",f:"🇩🇰",r:6.89},
  PLN:{s:"zł",n:"Polish Zloty",f:"🇵🇱",r:4},
  HKD:{s:"$",n:"Hong Kong Dollar",f:"🇭🇰",r:7.82},
  NZD:{s:"$",n:"New Zealand Dollar",f:"🇳🇿",r:1.64}
};

let txns = JSON.parse(localStorage.getItem('ff_txns')) || [
  {id:1,type:'income',amount:5000,cat:'Salary',date:'2024-01-15',desc:'Monthly salary',pay:'Bank Transfer',curr:'USD'},
  {id:2,type:'expense',amount:350,cat:'Food',date:'2024-01-16',desc:'Groceries',pay:'Card',curr:'USD'},
  {id:3,type:'expense',amount:1200,cat:'Shopping',date:'2024-01-18',desc:'New clothes',pay:'Card',curr:'USD'},
  {id:4,type:'expense',amount:50000,cat:'Shopping',date:'2024-01-20',desc:'Electronics',pay:'Card',curr:'PKR'},
  {id:5,type:'income',amount:100000,cat:'Freelancing',date:'2024-01-22',desc:'Project payment',pay:'Bank Transfer',curr:'PKR'}
];

let budgets = JSON.parse(localStorage.getItem('ff_budgets')) || {Food:500,Shopping:1000,Entertainment:300,Bills:800};
let curr = localStorage.getItem('ff_curr') || 'USD';
let editId = null;
let activeCharts = [];

// ==================== HELPERS ====================
function conv(amt, from, to) {
  if (from === to) return amt;
  return (amt / (currencies[from]?.r || 1)) * (currencies[to]?.r || 1);
}

function fmt(n, c = curr) {
  const s = currencies[c]?.s || '$';
  return s + ' ' + n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

function save() {
  localStorage.setItem('ff_txns', JSON.stringify(txns));
  localStorage.setItem('ff_budgets', JSON.stringify(budgets));
}

function totals() {
  let inc = 0, exp = 0;
  txns.forEach(t => {
    const v = conv(t.amount, t.curr || 'USD', curr);
    t.type === 'income' ? inc += v : exp += v;
  });
  return {inc, exp, bal: inc - exp, sav: inc * 0.2};
}

function catExp() {
  const m = {};
  txns.filter(t => t.type === 'expense').forEach(t => {
    const v = conv(t.amount, t.curr || 'USD', curr);
    m[t.cat] = (m[t.cat] || 0) + v;
  });
  return m;
}

function catIcon(c) {
  const m = {Food:'🍔',Shopping:'🛍',Bills:'💡',Transport:'🚗',Entertainment:'🎮',Salary:'💼',Freelancing:'💻'};
  return m[c] || '💰';
}

const catColors = {
  Food:'#8b5cf6',Shopping:'#ec4899',Bills:'#f59e0b',
  Transport:'#06b6d4',Entertainment:'#10b981',Salary:'#3b82f6',Freelancing:'#a855f7'
};

// ==================== NAVIGATION ====================
function nav(page, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const titles = {dashboard:'Dashboard',transactions:'Transactions',analytics:'Analytics',budget:'Budget Planner',profile:'Profile & Settings'};
  document.getElementById('pageTitle').textContent = titles[page] || page;
  renderPage(page);
}

function renderPage(p) {
  activeCharts.forEach(c => { try { c.destroy(); } catch(e){} });
  activeCharts = [];
  const el = document.getElementById('page');
  if (p === 'dashboard') el.innerHTML = dashHTML();
  else if (p === 'transactions') el.innerHTML = txnsHTML();
  else if (p === 'analytics') el.innerHTML = analyticsHTML();
  else if (p === 'budget') el.innerHTML = budgetHTML();
  else if (p === 'profile') el.innerHTML = profileHTML();
  requestAnimationFrame(() => {
    if (p === 'dashboard') initDashCharts();
    else if (p === 'analytics') initAnalyticsCharts();
    else if (p === 'budget') initBudgetUI();
    else if (p === 'transactions') initTxTable();
  });
}

function txnsHTML() {
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div style="display:flex;gap:10px">
      <select class="input-field" id="fType" style="width:auto" onchange="renderTxTable()">

      </select>

function initTxTable() { renderTxTable(); }

function renderTxTable() {
  const t = document.getElementById('fType')?.value || 'all';
  const s = document.getElementById('fSearch')?.value.toLowerCase() || '';
  let list = [...txns].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (t !== 'all') list = list.filter(x => x.type === t);
  if (s) list = list.filter(x => x.desc.toLowerCase().includes(s) || x.cat.toLowerCase().includes(s));
  document.getElementById('txTable').innerHTML = list.length
    ? list.map(t => {
        const v = conv(t.amount, t.curr || 'USD', curr);
        return `<div class="tx-row">
          <div class="tx-avatar" style="background:${t.type==='income'?'rgba(16,185,129,.12)':'rgba(239,68,68,.12)'};color:${t.type==='income'?'#34d399':'#f87171'}">${catIcon(t.cat)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:500">${t.desc}</div>
            <div style="font-size:12px;color:rgba(255,255,255,.35);margin-top:2px">${t.cat} · ${t.date} · <span class="tag">${t.pay}</span></div>
          </div>
          <span class="badge ${t.type}">${t.type==='income'?'↑ Income':'↓ Expense'}</span>
          <div style="text-align:right;min-width:100px">
            <div style="font-weight:700;font-size:15px;color:${t.type==='income'?'#34d399':'#f87171'}">${t.type==='income'?'+':'-'}${fmt(v)}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.3)">${currencies[t.curr||'USD']?.f} ${t.amount}</div>
          </div>
          <div style="display:flex;gap:6px;margin-left:8px">
            <button onclick="editTx(${t.id})" style="background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.2);color:#60a5fa;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:12px"><i class="fas fa-edit"></i></button>

// ==================== CHARTS ====================
function initDashCharts() {
  const ce = catExp();
  const pie = document.getElementById('pieChart')?.getContext('2d');
  if (pie && Object.keys(ce).length) {
    const ch = new Chart(pie, {
      type: 'doughnut',
      data: {
        labels: Object.keys(ce),
        datasets: [{data: Object.values(ce), backgroundColor: Object.keys(ce).map(k => catColors[k] || '#6366f1'), borderWidth: 0, hoverBorderWidth: 2, hoverBorderColor: '#fff'}]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: {position:'right', labels:{color:'rgba(255,255,255,.6)',font:{size:11},padding:12,boxWidth:10,usePointStyle:true,pointStyle:'circle'}},
          tooltip: {callbacks: {label: l => `${l.label}: ${fmt(l.raw)}`}}
        },
        cutout: '65%'
      }
    });
    activeCharts.push(ch);
  }

  const monthly = Array(12).fill(0);
  txns.filter(t => t.type === 'expense').forEach(t => {
    monthly[new Date(t.date).getMonth()] += conv(t.amount, t.curr || 'USD', curr);
  });

  const bar = document.getElementById('barChart')?.getContext('2d');
  if (bar) {
    const ch = new Chart(bar, {
      type: 'bar',
      data: {
        labels: ['J','F','M','A','M','J','J','A','S','O','N','D'],
        datasets: [{label:'Expenses', data:monthly, backgroundColor:'rgba(124,58,237,.5)', borderColor:'rgba(139,92,246,.8)', borderWidth:1.5, borderRadius:6, hoverBackgroundColor:'rgba(139,92,246,.8)'}]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {legend:{display:false}},
        scales: {
          x: {grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}}},
          y: {grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}, callback: v => fmt(v).split('.')[0]}}
        }
      }
    });
    activeCharts.push(ch);
  }
}

function initAnalyticsCharts() {
  const monthly = Array(12).fill(0);
  const monthlyInc = Array(12).fill(0);
  txns.forEach(t => {
    const v = conv(t.amount, t.curr || 'USD', curr);
    if (t.type === 'expense') monthly[new Date(t.date).getMonth()] += v;
    else monthlyInc[new Date(t.date).getMonth()] += v;
  });

  const line = document.getElementById('lineChart')?.getContext('2d');
  if (line) {
    const ch = new Chart(line, {
      type: 'line',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{label:'Spending', data:monthly, borderColor:'#a855f7', backgroundColor:'rgba(168,85,247,.08)', fill:true, tension:.4, pointBackgroundColor:'#a855f7', pointRadius:4}]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {legend:{display:false}},
        scales: {
          x: {grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}}},
          y: {grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}}}
        }
      }
    });
    activeCharts.push(ch);
  }

  const ce = catExp();
  const total = Object.values(ce).reduce((a,b) => a+b, 0) || 1;
  const ins = document.getElementById('catInsights');
  if (ins) ins.innerHTML = Object.entries(ce).map(([k,v]) => `
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
        <span>${catIcon(k)} ${k}</span><span style="font-weight:600">${fmt(v)}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,(v/total)*100).toFixed(1)}%;background:${catColors[k]||'#8b5cf6'}"></div></div>
    </div>`).join('');

  const ie = document.getElementById('incExpChart')?.getContext('2d');
  if (ie) {
    const ch = new Chart(ie, {
      type: 'bar',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [
          {label:'Income', data:monthlyInc, backgroundColor:'rgba(16,185,129,.5)', borderColor:'rgba(52,211,153,.8)', borderWidth:1.5, borderRadius:5},
          {label:'Expenses', data:monthly, backgroundColor:'rgba(239,68,68,.4)', borderColor:'rgba(248,113,113,.7)', borderWidth:1.5, borderRadius:5}
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {legend:{labels:{color:'rgba(255,255,255,.6)',font:{size:11}}}},
        scales: {
          x: {grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}}},
          y: {grid:{color:'rgba(255,255,255,.06)'}, ticks:{color:'rgba(255,255,255,.4)',font:{size:11}}}
        }
      }
    });
    activeCharts.push(ch);
  }
}

function initBudgetUI() {
  const ce = catExp();
  const container = document.getElementById('budgetCards');
  if (!container) return;
  container.innerHTML = Object.entries(budgets).map(([cat, lim]) => {
    const spent = ce[cat] || 0;
    const pct = Math.min(100, (spent / lim) * 100);
    const over = spent > lim;
    return `<div class="glass" style="padding:22px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div><div style="font-size:16px;margin-bottom:4px">${catIcon(cat)}</div><div style="font-weight:600;font-size:15px">${cat}</div></div>
        ${over ? '<span class="badge expense">⚠ Over</span>' : '<span class="badge income">On track</span>'}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.5);margin-bottom:8px">
        <span>Spent</span><span><b style="color:#fff">${fmt(spent)}</b> / ${fmt(lim)}</span>
      </div>
      <div class="progress-track"><div class="progress-fill ${over?'over':''}" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:8px">${pct.toFixed(0)}% of budget used</div>
    </div>`;
  }).join('');
}

// ==================== MODAL ====================
function openModal(id = null) {
  editId = id;
  document.getElementById('modalTitle').textContent = id ? 'Edit Transaction' : 'Add Transaction';
  const sel = document.getElementById('mCurr');
  sel.innerHTML = Object.entries(currencies).map(([c,d]) => `<option value="${c}" ${curr===c?'selected':''}>${d.f} ${c}</option>`).join('');
  document.getElementById('mDate').value = new Date().toISOString().slice(0, 10);
  if (id) {
    const t = txns.find(x => x.id === id);
    if (t) {
      document.getElementById('mAmt').value = t.amount;
      document.getElementById('mDesc').value = t.desc;
      document.getElementById('mDate').value = t.date;
      document.getElementById('mType').value = t.type;
      document.getElementById('mPay').value = t.pay;
      document.getElementById('mCurr').value = t.curr || 'USD';
      document.getElementById('mCat').value = t.cat;
    }
  }
  document.getElementById('txModal').classList.add('open');
}

function closeModal() { document.getElementById('txModal').classList.remove('open'); }

function saveTx() {
  const amt = parseFloat(document.getElementById('mAmt').value);
  if (!amt || isNaN(amt)) return toast('Enter a valid amount', 'error');
  const t = {
    id: editId || Date.now(),
    type: document.getElementById('mType').value,
    amount: amt,
    curr: document.getElementById('mCurr').value,
    cat: document.getElementById('mCat').value,
    date: document.getElementById('mDate').value,
    desc: document.getElementById('mDesc').value || 'Transaction',
    pay: document.getElementById('mPay').value
  };
  if (editId) {
    const i = txns.findIndex(x => x.id === editId);
    if (i !== -1) txns[i] = t;
  } else {
    txns.push(t);
  }
  save();
  closeModal();
  renderPage(document.querySelector('.nav-item.active span')?.textContent.toLowerCase() || 'dashboard');
  toast(`Transaction saved in ${currencies[t.curr]?.f} ${t.curr}`);
}

function delTx(id) {
  if (confirm('Delete this transaction?')) {
    txns = txns.filter(t => t.id !== id);
    save();
    renderTxTable();
    toast('Transaction deleted');
  }
}

function editTx(id) { openModal(id); }

function addBudget() {
  const cat = prompt('Category name (e.g. Food, Bills):');
  if (!cat) return;
  const lim = parseFloat(prompt(`Budget limit in ${curr}:`));
  if (!lim || isNaN(lim)) return;
  budgets[cat] = lim;
  save();
  initBudgetUI();
  toast('Budget saved');
}

// ==================== CURRENCY DROPDOWN ====================
function renderCurrList(q = '') {
  const list = document.getElementById('currList');
  if (!list) return;
  const filtered = Object.entries(currencies).filter(([c,d]) =>
    c.toLowerCase().includes(q.toLowerCase()) || d.n.toLowerCase().includes(q.toLowerCase())
  );
  list.innerHTML = filtered.map(([c,d]) =>
    `<div class="curr-opt ${curr===c?'sel':''}" onclick="selectCurr('${c}')">
      <span style="font-size:20px">${d.f}</span>
      <span style="font-weight:600;min-width:44px;font-size:13px">${c}</span>
      <span style="color:rgba(255,255,255,.4);font-size:12px">${d.n}</span>
    </div>`
  ).join('');
  if (!filtered.length) list.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.3);font-size:13px">No currency found</div>';
}

function toggleDrop() {
  const p = document.getElementById('dropPanel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) {
    document.getElementById('currSearch').value = '';
    renderCurrList('');
    document.getElementById('currSearch').focus();
  }
}

function closeDrop() { document.getElementById('dropPanel').classList.remove('open'); }

function selectCurr(c) {
  curr = c;
  localStorage.setItem('ff_curr', c);
  document.getElementById('selFlag').textContent = currencies[c]?.f || '';
  document.getElementById('selCode').textContent = c;
  closeDrop();
  renderPage(document.querySelector('.nav-item.active span')?.textContent.toLowerCase() || 'dashboard');
  toast(`Currency set to ${currencies[c]?.f} ${c}`);
}

// ==================== TOAST ====================
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle" style="color:#34d399':'fa-exclamation-circle" style="color:#f87171'}"></i>${msg}`;
  el.style.display = 'flex';
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.style.display = 'none', 3000);
}

// ==================== INIT ====================
document.addEventListener('click', e => { if (!e.target.closest('#currDropWrapper')) closeDrop(); });
renderCurrList();
renderPage('dashboard');
</script>
